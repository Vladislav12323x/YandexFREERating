{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Мой профиль</h4>
            </div>
            <div class="card-body text-center border-bottom">
                <img src="{{ url_for('static', filename='avatars/' + current_user.avatar_filename) if current_user.avatar_filename != 'default_avatar.png' else 'https://cdn-icons-png.flaticon.com/512/149/149071.png' }}" 
                     alt="Аватар" 
                     class="rounded-circle img-thumbnail mb-3" 
                     style="width: 150px; height: 150px; object-fit: cover;">
                <h3>{{ current_user.username }}</h3>
                <p class="text-muted">С нами с: {{ current_user.created_at.strftime('%Y-%m-%d') }}</p>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email адрес</label>
                        <input type="email" class="form-control" id="email" name="email" 
                               value="{{ current_user.email }}" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="avatar" class="form-label">Сменить аватарку</label>
                        <input type="file" class="form-control" id="avatar" name="avatar" accept="image/*">
                        <div class="form-text">Поддерживаются форматы: PNG, JPG, JPEG, GIF</div>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                        <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">Назад в кабинет</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
